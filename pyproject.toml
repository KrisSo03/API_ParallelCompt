[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "renewable-atlas"
version = "1.0.0"
description = "Production-ready prototype for parallel processing of climate data to create renewable energy potential atlas for Central America"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Claude", email = "noreply@anthropic.com"}]
license = {text = "MIT"}

dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "dask[dataframe]>=2023.9.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "plotly>=5.16.0",
    "tenacity>=8.2.3",
    "python-dotenv>=1.0.0",
    "psutil>=6.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "respx>=0.20.0",
    "mypy>=1.5.0",
    "ruff>=0.0.290",
    "black>=23.9.0",
    "ipython>=8.15.0",
    "jupyter>=1.0.0",
]

[project.scripts]
renewable-atlas = "renewable_atlas.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages]
find = {where = ["src"]}

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --strict-markers"
